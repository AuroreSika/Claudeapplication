<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compta</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--txt:#1d2433;--mut:#6b7385;--line:#e3e6ec;--ok:#16794c;--ko:#c0392b;--acc:#2f5bea}
  @media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--txt:#e8ebf2;--mut:#98a0b3;--line:#2a3045;--ok:#4cc38a;--ko:#ff7b6b;--acc:#7a9bff}}
  *{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0}main{max-width:1000px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
  .grid .card{margin:0}.lbl{color:var(--mut);font-size:13px}.big{font-size:22px;font-weight:600;margin-top:4px}
  .ok{color:var(--ok)}.ko{color:var(--ko)}
  form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  input,select,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--txt)}
  button{background:var(--acc);color:#fff;border:0;cursor:pointer}button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
  button.x{background:none;color:var(--ko);padding:2px 8px}
  table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:13px}
  td.n,th.n{text-align:right;white-space:nowrap}.wrap{overflow-x:auto}
  .bar{height:8px;border-radius:4px;background:var(--acc);margin-top:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #err{color:var(--ko);min-height:1.2em;margin:6px 0}h2{font-size:15px;margin:0 0 10px}
</style>
</head>
<body>
<header>
  <h1>📒 Compta</h1>
  <div class="row">
    <input type="month" id="month" aria-label="Mois">
    <a href="#" id="export"><button class="sec" type="button">Exporter CSV</button></a>
    <button class="sec" type="button" id="importBtn">Importer CSV</button>
    <input type="file" id="importFile" accept=".csv" hidden>
  </div>
</header>
<main>
  <div class="grid">
    <div class="card"><div class="lbl">Solde total</div><div class="big" id="solde"></div></div>
    <div class="card"><div class="lbl">Recettes du mois</div><div class="big ok" id="rec"></div></div>
    <div class="card"><div class="lbl">Dépenses du mois</div><div class="big ko" id="dep"></div></div>
    <div class="card"><div class="lbl">Résultat du mois</div><div class="big" id="res"></div></div>
  </div>

  <div class="card">
    <h2 id="formTitle">Nouvelle opération</h2>
    <form class="add" id="form">
      <input type="date" name="date" required>
      <input name="label" placeholder="Libellé" required>
      <input name="amount" placeholder="Montant (€)" inputmode="decimal" required>
      <select name="kind"><option value="depense">Dépense</option><option value="recette">Recette</option></select>
      <select name="category_id"></select>
      <select name="account_id"></select>
      <input name="note" placeholder="Note (facultatif)">
      <button>Enregistrer</button>
      <button type="button" class="sec" id="cancel" hidden>Annuler</button>
    </form>
    <div id="err" role="alert"></div>
  </div>

  <div class="card"><h2>Dépenses et recettes par catégorie</h2><div id="cats"></div></div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Opérations</h2>
      <input id="search" placeholder="Rechercher…"></div>
    <div class="wrap"><table><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Compte</th><th class="n">Montant</th><th></th></tr></thead>
    <tbody id="tx"></tbody></table></div>
  </div>

  <div class="card"><h2>Gérer</h2>
    <div class="row">
      <input id="newAcc" placeholder="Nouveau compte"><input id="newAccBal" placeholder="Solde initial" size="10"><button id="addAcc" class="sec">Ajouter le compte</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="newCat" placeholder="Nouvelle catégorie"><select id="newCatKind"><option value="depense">Dépense</option><option value="recette">Recette</option></select><button id="addCat" class="sec">Ajouter la catégorie</button>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
